# /etc/nginx/sites-available/irregular.derjure.de
# TLS certificate e.g. via: certbot --nginx -d irregular.derjure.de
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name irregular.derjure.de;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name irregular.derjure.de;

    ssl_certificate     /etc/letsencrypt/live/irregular.derjure.de/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/irregular.derjure.de/privkey.pem;

    # WebSocket endpoint used by the 1v1 mode
    location /ws {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;   # server pings every 25s; keep idle sockets open
        proxy_send_timeout 3600s;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
